<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />

  <title>AutoMind AI — Intelligent Car Recommendation Chatbot</title>
  <meta name="description" content="AI-powered automotive recommendation engine helping car buyers discover, compare, and shortlist ideal vehicles based on budget, lifestyle, and preferences." />

          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"Space Grotesk"', 'monospace'],

          colors: {
            primary: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
              950: '#0b193d',

          }
        }
      }
    };

    <div style="padding: 2rem; text-align: center; color: white; background: #0f172a;">
      <h2>JavaScript Required</h2>
      <p>AutoMind AI requires JavaScript to run the interactive recommendation engine and chatbot.</p>
